
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calky - Smart Calculator</title>

<link rel="stylesheet" href="styles.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>



<!-- Security Screen -->

<div id="security-screen">

<h2>Enter Security Code</h2>

<input type="password" id="security-code" placeholder="Enter code">

<button onclick="checkSecurity()">Unlock</button>

</div>



<!-- Main Calculator -->

<div id="calculator-app" class="hidden">

<div class="tabs">

<button onclick="showTab('basic')">Basic</button>

<button onclick="showTab('scientific')">Scientific</button>

<button onclick="showTab('graph')">Graph</button>

</div>



<!-- BASIC CALCULATOR -->

<div id="basic" class="calculator">

<input type="text" id="display-basic" disabled>

<div class="buttons-grid">

<button onclick="clearDisplay('basic')">C</button>

<button onclick="appendToDisplay('(', 'basic')">(</button>

<button onclick="appendToDisplay(')', 'basic')">)</button>

<button onclick="appendToDisplay('/', 'basic')">÷</button>



<button onclick="appendToDisplay('7', 'basic')">7</button>

<button onclick="appendToDisplay('8', 'basic')">8</button>

<button onclick="appendToDisplay('9', 'basic')">9</button>

<button onclick="appendToDisplay('*', 'basic')">×</button>



<button onclick="appendToDisplay('4', 'basic')">4</button>

<button onclick="appendToDisplay('5', 'basic')">5</button>

<button onclick="appendToDisplay('6', 'basic')">6</button>

<button onclick="appendToDisplay('-', 'basic')">-</button>



<button onclick="appendToDisplay('1', 'basic')">1</button>

<button onclick="appendToDisplay('2', 'basic')">2</button>

<button onclick="appendToDisplay('3', 'basic')">3</button>

<button onclick="appendToDisplay('+', 'basic')">+</button>



<button onclick="appendToDisplay('0', 'basic')" class="zero">0</button>

<button onclick="appendToDisplay('.', 'basic')">.</button>

<button onclick="calculate('basic')">=</button>

</div>

</div>



<!-- SCIENTIFIC CALCULATOR -->

<div id="scientific" class="calculator hidden">

<input type="text" id="display-scientific" disabled>

<div class="buttons-grid">

<button onclick="clearDisplay('scientific')">C</button>

<button onclick="appendToDisplay('Math.sin(', 'scientific')">sin</button>

<button onclick="appendToDisplay('Math.cos(', 'scientific')">cos</button>

<button onclick="appendToDisplay('Math.tan(', 'scientific')">tan</button>



<button onclick="appendToDisplay('Math.log(', 'scientific')">log</button>

<button onclick="appendToDisplay('Math.sqrt(', 'scientific')">√</button>

<button onclick="appendToDisplay('**', 'scientific')">^</button>

<button onclick="calculate('scientific')">=</button>

</div>

</div>



<!-- GRAPHING CALCULATOR -->

<div id="graph" class="calculator hidden">

<input type="text" id="equation" placeholder="Enter equation (e.g., x*x - 2*x + 1)">

<button onclick="plotGraph()">Plot</button>

<canvas id="graphCanvas"></canvas>

</div>

</div>



<script src="script.js"></script>

</body>

</html>
