<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calky - Modern Calculator</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>



    <!-- Loading Screen -->

    <div id="loading-screen">

        <div class="loading-content">

            <div class="spinner"></div>

            <p>Loading Calky...</p>

        </div>

    </div>



    <div id="calculator-app" class="light-mode hidden">

        <!-- Theme Toggle -->

        <div class="theme-toggle">

            <button id="toggle-theme">🌙</button>

        </div>



        <!-- Display -->

        <div class="display">

            <div id="current-operation"></div>

            <div id="result">0</div>

        </div>



        <!-- Buttons -->

        <div class="buttons-grid">

            <button class="clear" onclick="clearDisplay()">AC</button>

            <button onclick="appendOperation('%')">%</button>

            <button class="delete" onclick="deleteLast()">⌫</button>

            <button onclick="appendOperation('/')">÷</button>



            <button onclick="appendNumber('7')">7</button>

            <button onclick="appendNumber('8')">8</button>

            <button onclick="appendNumber('9')">9</button>

            <button onclick="appendOperation('*')">×</button>



            <button onclick="appendNumber('4')">4</button>

            <button onclick="appendNumber('5')">5</button>

            <button onclick="appendNumber('6')">6</button>

            <button onclick="appendOperation('-')">−</button>



            <button onclick="appendNumber('1')">1</button>

            <button onclick="appendNumber('2')">2</button>

            <button onclick="appendNumber('3')">3</button>

            <button onclick="appendOperation('+')">+</button>



            <button class="reverse" onclick="toggleSign()">+/-</button>

            <button class="zero" onclick="appendNumber('0')">0</button>

            <button onclick="appendNumber('.')">.</button>

            <button class="equal" onclick="calculate()">=</button>

        </div>

    </div>



    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
