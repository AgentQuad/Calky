<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Modern Calculator</title>

<link rel="stylesheet" href="styles.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div id="security-screen">

<h2>Enter Security Code</h2>

<input type="password" id="security-code" placeholder="Enter code">

<button onclick="checkSecurity()">Unlock</button>

</div>

<div id="calculator-app" class="hidden">

<!-- Tabs -->

<div class="tabs">

<button onclick="showTab('basic')">Basic</button>

<button onclick="showTab('scientific')">Scientific</button>

<button onclick="showTab('graph')">Graph</button>

</div>

<!-- Basic Calculator -->

<div id="basic" class="calculator"></div>

<!-- Scientific Calculator -->

<div id="scientific" class="calculator hidden"></div>

<!-- Graphing Calculator -->

<div id="graph" class="calculator hidden"></div>

</div>

<script src="script.js"></script>

</body>

</html>
